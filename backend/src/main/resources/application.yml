# Общие настройки. Секреты берутся из переменных окружения,
# после двоеточия стоят значения по умолчанию для локальной разработки.
spring:
  application:
    name: mailforge-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mailforge}
    username: ${DB_USER:mailforge}
    password: ${DB_PASSWORD:change_me}
  jpa:
    hibernate:
      ddl-auto: validate        # схему создаёт только Flyway, Hibernate лишь проверяет совпадение
    open-in-view: false         # не держим соединение с БД на время всего запроса
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:                      # Actuator: наружу только health и info
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  admin:                         # первый администратор (создаётся при первом запуске, блок 2)
    login: ${ADMIN_LOGIN:admin}
    password: ${ADMIN_PASSWORD:change_me_too}
