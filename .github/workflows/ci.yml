# CI: на каждый pull request и на каждый пуш в main собираем backend и гоняем тесты.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest        # на раннере уже установлен Docker (нужен Testcontainers)
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven            # кеш зависимостей, ускоряет сборки
      - name: Сборка и тесты
        run: mvn -B verify
